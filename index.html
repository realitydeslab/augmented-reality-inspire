<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reality Design Inspire</title>
<meta name="description" content="Forty years of augmented reality ideas: the most creative AR creators and their work, with playable videos, guided tours and classroom exercises. By Reality Design Lab.">
<link rel="alternate" type="text/markdown" href="inspire.md" title="Full catalog for AI (Markdown)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=1790537909">
</head>
<body>

<header class="masthead">
  <div class="masthead__top">
    <a class="brand" href="https://reality.design" target="_blank" rel="noopener" aria-label="reality design lab">
      <span class="brand__name">reality design lab</span>
      <span class="brand__tag">design new realities</span>
    </a>
    <div class="masthead__tools">
      <button class="lang-toggle mono" id="langToggle" type="button" aria-label="Switch language"></button>
      <button class="theme-toggle mono" id="themeToggle" type="button" aria-label="Toggle light or dark theme">◐</button>
    </div>
  </div>
  <h1 class="title" data-i18n-html="title"></h1>
  <p class="lede" data-i18n="lede"></p>
  <dl class="stats mono" id="stats"></dl>
</header>

<nav class="tabs" role="tablist" aria-label="Views">
  <button role="tab" data-view="keys" class="tab" data-i18n="tab_keys"></button>
  <button role="tab" data-view="salient" class="tab" data-i18n="tab_salient"></button>
  <button role="tab" data-view="vfx" class="tab" data-i18n="tab_vfx"></button>
  <button role="tab" data-view="related" class="tab" data-i18n="tab_related"></button>
  <button role="tab" data-view="works" class="tab" data-i18n="tab_works"></button>
  <button role="tab" data-view="creators" class="tab" data-i18n="tab_creators"></button>
  <button role="tab" data-view="modules" class="tab" data-i18n="tab_modules"></button>
  <button role="tab" data-view="starred" class="tab"><span data-i18n="tab_starred"></span> <span class="tab__count mono" id="starCount"></span></button>
</nav>

<section class="filters" id="filters" aria-label="Filters">
  <div class="filters__row">
    <label class="search">
      <span class="visually-hidden" data-i18n="search_label"></span>
      <input id="q" type="search" autocomplete="off">
    </label>
    <div class="chips" id="eraChips"></div>
    <div class="chips" id="platformChips"></div>
    <select id="sort" class="mono" aria-label="Sort">
      <option value="new" data-i18n="sort_new"></option>
      <option value="old" data-i18n="sort_old"></option>
      <option value="creator" data-i18n="sort_creator"></option>
    </select>
    <button id="keyOnly" class="chip chip--key" type="button" aria-pressed="false" data-i18n="key_only"></button>
    <button id="salientOnly" class="chip chip--key" type="button" aria-pressed="false" data-i18n="salient_only"></button>
    <button id="codeOnly" class="chip chip--key" type="button" aria-pressed="false" data-i18n="code_only"></button>
    <button id="clear" class="mono clear" type="button" data-i18n="clear"></button>
  </div>
  <div class="chips chips--interaction" id="interactionChips"></div>
  <div class="active-creator mono" id="activeCreator" hidden></div>
</section>

<main id="main">
  <div id="view-keys" class="view"><div id="keyList"></div></div>
  <div id="view-salient" class="view"><div id="salientHead"></div><div id="salientGrid"></div></div>
  <div id="view-vfx" class="view"><div id="vfxHead"></div><div id="vfxGrid"></div></div>
  <div id="view-related" class="view"><div id="relatedHead"></div><div id="relatedGrid"></div></div>
  <div id="view-works" class="view"><p class="count mono" id="worksCount"></p><div class="grid" id="grid"></div></div>
  <div id="view-creators" class="view"><div id="creatorList"></div></div>
  <div id="view-modules" class="view"><div id="moduleList"></div></div>
  <div id="view-starred" class="view"><div id="starredHead"></div><div class="grid" id="starGrid"></div></div>
  <p class="empty" id="empty" hidden></p>
</main>

<footer class="foot mono">
  <span id="generated"></span>
  <span data-i18n-html="foot_ai"></span>
  <span data-i18n="foot_rights"></span>
</footer>

<dialog id="tour" class="tour" aria-label="Creator tour">
  <div class="tour__inner" id="tourInner"></div>
</dialog>

<dialog id="player" class="player" aria-label="Work details">
  <div class="player__inner">
    <div class="player__media" id="playerMedia"></div>
    <aside class="player__info" id="playerInfo"></aside>
    <button class="player__close mono" id="playerClose" type="button" aria-label="Close">ESC ✕</button>
    <button class="player__nav player__nav--prev" id="prev" type="button" aria-label="Previous">←</button>
    <button class="player__nav player__nav--next" id="next" type="button" aria-label="Next">→</button>
  </div>
</dialog>

<div class="toast mono" id="toast" role="status" hidden></div>

<script src="data/entries.js?v=1790537909"></script>
<script src="assets/i18n.js?v=1790537909"></script>
<script src="assets/export.js?v=1790537909"></script>
<script src="assets/app.js?v=1790537909"></script>
</body>
</html>
